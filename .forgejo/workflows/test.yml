name: test

# Unit suite for the ranking and text helpers, on the forge (git.bck.dev).
# Nothing runs on GitHub: it is a push mirror.
#
# The workflow and job are named `test` because `test / *` is the required
# check on main (bkennedy/infrastructure, tofu/forgejo).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: docker
    container:
      image: node:22-trixie@sha256:77d0c7953e80648137a237496c8edbcb3a14bedc5c5298b93a6d0dfa6c3e1271
    timeout-minutes: 10
    steps:
      # Pinned to a commit, not a tag: a tag on the actions mirror can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # bun's release zip from the runner cache when it is there: GitHub's
      # release CDN serves the runner at ~1 MB/s. install-tools.sh's fetch()
      # checks a restored zip against BUN_SHA256 exactly as it checks a
      # download, and saving is for main's runs only (INFRA-193).
      - name: Restore the bun download
        id: bun-download
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /root/.cache/ci-downloads
          key: ci-downloads-bun-${{ hashFiles('.forgejo/ci/install-tools.sh') }}

      - name: Install bun
        run: sh .forgejo/ci/install-tools.sh bun

      - name: Save the bun download
        if: github.event_name != 'pull_request' && steps.bun-download.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /root/.cache/ci-downloads
          key: ci-downloads-bun-${{ hashFiles('.forgejo/ci/install-tools.sh') }}

      # One devDependency (prettier) since INFRA-158, so the install is quick
      # and needs no cache step.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prettier gate first: unformatted code fails fast, and a whitespace-only
      # diff never reaches the test output (INFRA-158).
      - name: Format check
        run: bun run format:check

      - name: Unit suite
        run: bun test
